<!DOCTYPE html>
<html>
<head><title>Search</title></head>
<body>
  <h1>Search</h1>
  <form method="GET" action="/search">
    <input type="text" name="q" value="{{ query or '' }}"><br>
    <button type="submit">Search</button>
  </form>
  {% for r in results %}<p>{{ r }}</p>{% endfor %}
  <p><a href="/">Home</a></p>
</body>
</html>
